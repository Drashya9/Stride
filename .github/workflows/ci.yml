name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stride
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stride" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://stride:stride@localhost:5432/stride_test
      DATABASE_URL: postgres://stride:stride@localhost:5432/stride_test
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec drizzle-kit check
      - run: pnpm test
      - run: pnpm build
